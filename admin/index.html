async function capSave(i){await must(sb.from('gallery').update({caption:S.gallery.find(x=>x.id==i).cap}).eq('id',i));toast('Caption saved')}
async function del(k,i){if(!confirm('Delete this item? This cannot be undone.'))return;await must(sb.from(TB[k]).delete().eq('id',i));ref('Deleted')}
async function stk(i,n){const p=S.products.find(x=>x.id==i);p.stock=Math.max(0,p.stock+n);prodList();await must(sb.from('products').update({stock:p.stock}).eq('id',i))}
async function pSave(i){if(!a1.value.trim())return toast('Enter a product name');const v={name:a1.value,category:a2.value,note:a3.value,price:+a4.value||0,stock:+a5.value||0,visible:a6.checked,image_url:_pi||null};await must(i==null?sb.from('products').insert({...v,sort:S.products.length}):sb.from('products').update(v).eq('id',i));shut();ref('Product saved. Live on the website')}
async function catAdd(){const v=a1.value.trim();if(!v||S.cats.includes(v))return toast('Enter a new name');await must(sb.from('categories').insert({name:v}));await load();catForm();render()}
async function catDel(i){if(S.products.some(p=>p.category==S.cats[i]))return toast('Move its products first');await must(sb.from('categories').delete().eq('name',S.cats[i]));await load();catForm();render()}
async function setSt(i,s,q){S.enq.find(x=>x.id==i).st=s;await must(sb.from('enquiries').update({status:s}).eq('id',i));q?setTimeout(render,300):render()}
async function addFrom(i){const e=S.enq.find(x=>x.id==i);if(e.phone&&S.cust.some(c=>c.phone==e.phone))return toast('Already a customer');await must(sb.from('customers').insert({name:e.name,phone:e.phone,note:e.topic}));ref('Customer saved')}
async function cSave(i){if(!a1.value.trim())return toast('Enter a name');const r={name:a1.value,phone:a2.value,note:a3.value};await must(i==null?sb.from('customers').insert(r):sb.from('customers').update(r).eq('id',i));shut();ref('Customer saved')}
let LE='',FL='up';
const seen=()=>{try{return localStorage.getItem('gilly_seen')}catch(e){}},mark=()=>{try{localStorage.setItem('gilly_seen','1')}catch(e){}};
function loginUI(m,mode,info){mode=mode||(seen()?'in':'up');$('nav').style.display='none';$('#tb').style.display='none';$('.app').style.gridTemplateColumns='1fr';
const tabs=(mode=='up'||mode=='in')?`<div class=tabs><button class="${mode=='up'?'on':''}" onclick="LE=window.em?em.value:LE;loginUI('','up')">Sign up</button><button class="${mode=='in'?'on':''}" onclick="LE=window.em?em.value:LE;loginUI('','in')">Log in</button></div>`:'';
const em=`<label>Email</label><input id=em type=email autocomplete=username value="${esc(LE)}" onkeydown="if(event.key=='Enter')go()">`;
const H={up:`<p style="color:var(--mut)">Enter your email. We will send you a 6-digit code.</p>${em}`,in:`${em}<label>Password</label><input id=pw type=password autocomplete=current-password onkeydown="if(event.key=='Enter')signIn()">`,forgot:`<h3>Forgot password</h3><p style="color:var(--mut)">Enter your email. We will send you a 6-digit code.</p>${em}`,
code:`<p style="color:var(--mut)">Enter the 6-digit code sent to <b>${esc(LE)}</b>.</p><label>Code</label><input id=cd inputmode=numeric maxlength=8 autocomplete=one-time-code style="font-size:24px;letter-spacing:6px" onkeydown="if(event.key=='Enter')verifyCode()">`,
newpw:`<h3>${FL=='up'?'Set your password':'Reset your password'}</h3><p style="color:var(--mut)">Use at least 8 characters.</p><label>New password</label><input id=p1 type=password autocomplete=new-password><label>Repeat password</label><input id=p2 type=password autocomplete=new-password onkeydown="if(event.key=='Enter')savePw()">`}[mode];
const B={up:`<button class="b p" onclick="sendCode('up')">Send code</button>`,in:`<button class="b p" onclick="signIn()">Log in</button><button class="b s" onclick="LE=em.value.trim();loginUI('','forgot')">Forgot password?</button>`,forgot:`<button class="b p" onclick="sendCode('reset')">Send code</button><button class="b s" onclick="loginUI('','in')">Back to log in</button>`,code:`<button class="b p" onclick="verifyCode()">Verify code</button><button class="b s" onclick="sendCode()">Send a new code</button>`,newpw:`<button class="b p" onclick="savePw()">Save password</button>`}[mode];
window.go=()=>({up:()=>sendCode('up'),in:signIn,forgot:()=>sendCode('reset')}[mode]||(()=>{}))();
$('#m').innerHTML=`<div class=card style="max-width:380px;margin:10vh auto"><h1>Gilly Admin</h1><p style="margin:2px 0 14px;color:var(--mut)">Manage the website</p>${tabs}${info?`<p style="color:var(--ok)">${info}</p>`:''}${H}<p style="color:var(--bad)">${m||''}</p><div class=row>${B}</div></div>`}
async function signIn(){LE=em.value.trim().toLowerCase();const{error}=await sb.auth.signInWithPassword({email:LE,password:pw.value});if(error)return loginUI('Wrong email or password.','in');mark();start()}
async function sendCode(f){FL=f||FL;LE=(window.em?em.value:LE).trim().toLowerCase();if(!LE)return;const up=FL=='up',{error}=await sb.auth.signInWithOtp({email:LE,options:{shouldCreateUser:up}});
if(error){const x=error.message;return loginUI(up?(/database|closed|not allowed/i.test(x)?'Admin sign-up is closed. All 3 admin accounts already exist. Use Log in.':'Could not send the code: '+x):(/signups not allowed|not found/i.test(x)?'No admin account found for this email. Use Sign up.':'Could not send the code: '+x),up?'up':'forgot')}
loginUI('','code','Code sent. Check your inbox and spam.')}
async function verifyCode(){const k=cd.value.trim();let r=await sb.auth.verifyOtp({email:LE,token:k,type:'email'});if(r.error)r=await sb.auth.verifyOtp({email:LE,token:k,type:'signup'});r.error?loginUI('That code is wrong or expired.','code'):loginUI('','newpw')}
async function savePw(){if(p1.value.length<8)return loginUI('Use at least 8 characters.','newpw');if(p1.value!==p2.value)return loginUI('The passwords do not match.','newpw');const{error}=await sb.auth.updateUser({password:p1.value});if(error)return loginUI(error.message,'newpw');mark();start()}
async function out(){await sb.auth.signOut();window.AUTH=false;loginUI()}
async function start(){if(CFG.key.startsWith('YOUR_'))return loginUI('Add your Supabase URL and key to config.js first.');const{data:{session}}=await sb.auth.getSession();if(!session)return loginUI();const{data:ok}=await sb.rpc('is_admin');if(!ok){await sb.auth.signOut();return loginUI('This account is not an admin.')}$('nav').style.display='';$('#tb').style.display='';$('.app').style.gridTemplateColumns='';try{await load()}catch(e){return loginUI('Could not load data. Check the setup guide.')}window.AUTH=true;render()}
setInterval(async()=>{if(!window.AUTH||$('#dg').open||!(V=='dash'||V=='cust')||document.activeElement.tagName=='INPUT'||!S.site)return;try{const n=S.enq.length;await load();if(S.enq.length!=n)render()}catch(e){}},60000);
function render(){const nw=S.enq.filter(e=>e.st=='new').length,I={dash:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',pages:'<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7"/>',prod:'<path d="M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10"/>',cust:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.400 3.600-7 8-7s8 2.600 8 7"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.500 1.500M17.500 17.500L19 19M5 19l1.500-1.500M17.500 6.500L19 5"/>',out:'<path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/>'},
ic=k=>`<svg viewBox="0 0 24 24" width=22 height=22 fill=none stroke=currentColor stroke-width=1.8 stroke-linecap=round stroke-linejoin=round aria-hidden=true>${I[k]}</svg>`,
items=[['dash','Dashboard','Home'],['pages','Pages & content','Pages'],['prod','Products & services','Products'],['cust','Users & customers','Customers']],
bd=k=>k=='cust'&&nw?`<span class=n>${nw}</span>`:'';
$('#nv').innerHTML=items.map(([k,t])=>`<button class="${V==k?'on':''}" onclick="go2('${k}')">${ic(k)}<span>${t}</span>${bd(k)}</button>`).join('')+`<hr><button onclick="toggleTheme()">${ic('sun')}<span>Light / dark</span></button><button onclick="out()">${ic('out')}<span>Sign out</span></button>`;
$('#tb').innerHTML=items.map(([k,t,s])=>`<button class="${V==k?'on':''}" onclick="go2('${k}')" aria-label="${t}">${ic(k)}<span>${s}</span>${bd(k)}</button>`).join('');
$('#m').innerHTML=({dash,pages,prod,cust})[V]();scrollTo(0,0)}
function go2(k){V=k;render()}
start();
</script></body></html>
